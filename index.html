<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7A4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Subs">
<title>Sunday Subs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EC;--card:#FFFFFF;--ink:#17261D;--muted:#5B6B61;--line:#D5DDD6;
  --turf:#2E7A4B;--turf2:#297044;--accent:#E8A317;--off:#E5483B;--on:#1FA85B;--board:#1B2420;--warn:#A9520D;--warnbg:#FFF1DE;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111915;--card:#1A241F;--ink:#E7EEE9;--muted:#98A89E;--line:#2B3931;
  --turf:#25673F;--turf2:#215E39;--board:#0D1410;--warn:#F2A451;--warnbg:#2D2216;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111915;--card:#1A241F;--ink:#E7EEE9;--muted:#98A89E;--line:#2B3931;
  --turf:#25673F;--turf2:#215E39;--board:#0D1410;--warn:#F2A451;--warnbg:#2D2216;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:84px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{max-width:560px;margin:0 auto;padding:14px 16px 24px}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.1;margin:0}
h1{font-size:30px}
h2{font-size:22px;margin:22px 0 10px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--turf);border-color:var(--turf);color:#fff}
.btn.danger{color:var(--off)}
.btn.small{min-height:36px;padding:6px 12px;font-size:15px}
.field{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}

/* match header */
.matchbar{display:grid;grid-template-columns:1fr 118px;gap:8px;margin:12px 0}
.matchbar .opp{display:flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px}
.matchbar .opp span{font-family:var(--cond);font-weight:600;color:var(--muted);margin-right:6px}
.matchbar .opp input{border:0;background:transparent;min-height:44px;width:100%;outline:none}

/* quarter selector */
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.qs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-family:var(--cond);font-weight:600;font-size:18px;position:relative;min-height:48px}
.qs button small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.qs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qs button[aria-pressed="true"] small{color:inherit;opacity:.75}
.qs button .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* pitch */
.pitch{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--turf) 0 12.5%,var(--turf2) 12.5% 25%);user-select:none}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:78px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff}
.slot .lbl{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.02em;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.slot .shirt{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--turf);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.25);border:3px solid #fff;transition:transform .15s}
.slot.gk .shirt{background:var(--accent);border-color:var(--accent);color:#2a1d00}
.slot.empty .shirt{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.8);color:#fff;box-shadow:none;font-size:24px}
.slot .nm{font-family:var(--cond);font-weight:600;font-size:15px;line-height:1.1;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px}
.slot.in .shirt{border-color:var(--on)}
.slot.moved .shirt{border-color:var(--accent)}
.pitch.placing .slot .shirt{transform:scale(1.08)}
.slot:active .shirt{transform:scale(.94)}

/* bench */
.bench{margin-top:10px}
.bench .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-family:var(--cond);font-weight:600;font-size:16px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip b{font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--turf);border-color:var(--turf);color:#fff}
.chip[aria-pressed="true"] b{color:#fff}
.hint{font-size:14px;color:var(--muted);margin-top:6px}

/* sub board */
.board{background:var(--board);color:#F2F5F3;border-radius:12px;padding:12px 14px;margin-top:14px;font-family:var(--cond)}
.board h3{font-size:18px;font-weight:600;color:#C9D3CD;margin-bottom:8px;display:flex;justify-content:space-between}
.sub{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.08);font-size:19px}
.sub:first-of-type{border-top:0}
.tag{font-weight:700;font-size:14px;border-radius:5px;padding:2px 7px;text-align:center;min-width:42px}
.tag.on{background:var(--on);color:#04220f}
.tag.off{background:var(--off);color:#2a0502}
.tag.mv{background:var(--accent);color:#2a1d00}
.sub em{font-style:normal;color:#AAB7AF;font-size:16px}
.board .none{color:#AAB7AF;font-size:17px}

/* warnings + minutes */
.warns{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:15px}
.warns div+div{margin-top:4px}
.mins{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr 92px 38px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .n{font-family:var(--cond);font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .n small{font-family:var(--body);font-weight:600;font-size:12px;color:var(--warn);margin-left:6px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.segs i{height:10px;border-radius:3px;background:var(--line)}
.segs i.f{background:var(--turf)}
.mrow .m{font-family:var(--cond);font-weight:700;font-size:18px;text-align:right}

/* thirty picker */
.thirty{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.thirty p{margin:6px 0 0;font-size:14px;color:var(--muted)}

/* match mode */
.clock{text-align:center;padding:18px 0 8px}
.clock .t{font-family:var(--cond);font-weight:700;font-size:min(30vw,132px);line-height:.95;font-variant-numeric:tabular-nums}
.clock .q{font-family:var(--cond);font-weight:600;font-size:20px;color:var(--muted)}
.prog{position:relative;height:10px;background:var(--line);border-radius:5px;margin:12px 0 16px;overflow:hidden}
.prog span{position:absolute;inset:0 auto 0 0;background:var(--turf)}
.prog i{position:absolute;top:0;bottom:0;width:2px;background:var(--paper)}
.ctrls{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.ctrls .btn{min-height:56px;font-size:18px}
.alert{background:var(--accent);color:#2a1d00;border-radius:12px;padding:12px 14px;margin-top:12px;font-family:var(--cond);font-weight:700;font-size:22px;display:flex;justify-content:space-between;align-items:center;animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.02)}}
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.lineup div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-family:var(--cond);font-weight:600;font-size:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lineup div small{display:block;color:var(--muted);font-size:12px}
.actions{display:grid;gap:8px;margin-top:18px}

/* squad */
.plist{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow input{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px;min-height:40px;width:100%}
.prow input:focus{border-color:var(--line);background:var(--paper)}
.prow .num{text-align:center;font-family:var(--cond);font-weight:700;font-size:18px}
.prow .nmi{font-family:var(--cond);font-weight:600;font-size:18px}
.prow.out .nmi,.prow.out .num{opacity:.45;text-decoration:line-through}
.toggles{display:flex;gap:4px}
.tg{border:1px solid var(--line);background:transparent;border-radius:8px;min-width:40px;min-height:36px;font-family:var(--cond);font-weight:700;font-size:14px;color:var(--muted)}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tg.x{color:var(--off)}
.add{display:grid;grid-template-columns:64px 1fr auto;gap:8px;margin-top:10px}

/* season */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:right;border-top:1px solid var(--line)}
th{font-family:var(--cond);font-weight:600;color:var(--muted);font-size:15px;border-top:0}
td:first-child,th:first-child{text-align:left}
td:first-child{font-family:var(--cond);font-weight:600;font-size:17px}
.hist{display:grid;gap:6px}
.hist div{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--paper);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.pick{display:grid;gap:6px;margin-top:10px}
.pick button{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:50px}
.pick .pn{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.pick .pm{font-family:var(--cond);font-weight:600;font-size:18px}
.pick .ps{font-size:13px;color:var(--muted);text-align:right}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;min-height:62px;font-family:var(--cond);font-weight:600;font-size:16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--turf)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--turf)}
.tabs .live{position:absolute;top:10px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--off)}
.backup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.backup p{margin:0 0 10px;font-size:15px}
.backup .ok{color:var(--turf);font-weight:600}
.backup .risk{color:var(--warn);font-weight:600}
.backup .row .btn{flex:1}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" class="view"></main>
<nav class="tabs" id="tabs"></nav>
<div id="sheet"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const KEY='sunday-subs-v1';
const FORMS={
 '3-3-2':[['GK',50,89],['LB',20,70],['CB',50,72],['RB',80,70],['LM',17,45],['CM',50,47],['RM',83,45],['LS',33,19],['RS',67,19]],
 '3-2-3':[['GK',50,89],['LB',20,70],['CB',50,72],['RB',80,70],['LCM',33,48],['RCM',67,48],['LW',17,22],['ST',50,17],['RW',83,22]],
 '2-3-2-1':[['GK',50,89],['LCB',32,72],['RCB',68,72],['LM',17,52],['CM',50,54],['RM',83,52],['LAM',32,32],['RAM',68,32],['ST',50,14]],
 '3-1-3-1':[['GK',50,89],['LB',20,72],['CB',50,74],['RB',80,72],['DM',50,58],['LM',17,40],['AM',50,38],['RM',83,40],['ST',50,15]]
};
const BL=[[0,15],[15,30],[30,45],[45,60]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
function blankMatch(f){return{opp:'',date:today(),formation:f||'3-3-2',avail:{},thirty:null,blocks:[0,1,2,3].map(()=>Array(9).fill(null)),timer:{start:null,acc:0},alerted:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s&&Array.isArray(s.players)&&s.match)return s}}catch(e){}return{players:[],match:blankMatch(),history:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),view='plan',cur=0,benchSel=null,flash=null,audio=null,wake=null;

const P=id=>S.players.find(p=>p.id===id);
const isAvail=id=>S.match.avail[id]!==false;
const byNum=l=>l.slice().sort((a,b)=>((a.num||999)-(b.num||999))||a.name.localeCompare(b.name));
const avail=()=>byNum(S.players.filter(p=>isAvail(p.id)));
const pos=i=>FORMS[S.match.formation][i][0];
const nm=id=>{const p=P(id);return p?p.name:'?'};
const mins=id=>S.match.blocks.reduce((t,b)=>t+(b.includes(id)?15:0),0);
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

function changes(b){
  if(b<1)return null;
  const prev=S.match.blocks[b-1],now=S.match.blocks[b];
  const off=prev.filter(id=>id&&!now.includes(id));
  const on=[],moved=[];
  now.forEach((id,i)=>{if(!id)return;const j=prev.indexOf(id);
    if(j<0)on.push({id,i,for:(prev[i]&&off.includes(prev[i]))?prev[i]:null});
    else if(j!==i)moved.push({id,from:j,to:i});});
  const paired=on.map(o=>o.for).filter(Boolean);
  return{on,moved,loneOff:off.filter(id=>!paired.includes(id)),count:on.length+off.length+moved.length};
}
function thirtyCounts(){const c={};S.history.forEach(h=>{if(h.thirty)c[h.thirty]=(c[h.thirty]||0)+1});return c}
function thirtySuggest(){
  const av=avail();if(!av.length)return null;const c=thirtyCounts();
  const last=id=>{for(let i=S.history.length-1;i>=0;i--)if(S.history[i].thirty===id)return i;return -1};
  return av.slice().sort((a,b)=>((c[a.id]||0)-(c[b.id]||0))||(last(a.id)-last(b.id)))[0];
}
function warnings(){
  const w=[],m=S.match;
  m.blocks.forEach((b,i)=>{const e=b.filter(x=>!x).length;if(e)w.push(`${BL[i][0]}–${BL[i][1]}' has ${e} empty position${e>1?'s':''}`)});
  if(m.thirty&&isAvail(m.thirty)){const t=mins(m.thirty);if(t!==30)w.push(`${esc(nm(m.thirty))} is this week's 30-minute player but is down for ${t}'`)}
  const filled=m.blocks.some(b=>b.some(Boolean));
  if(filled)avail().forEach(p=>{if(!mins(p.id))w.push(`${esc(p.name)} isn't down to play at all`)});
  return w;
}

/* ---------- views ---------- */
const ICONS={
 plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 12h16"/><circle cx="12" cy="12" r="3"/></svg>',
 match:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg>',
 squad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3 4 6l2 4 2-1v12h8V9l2 1 2-4-4-3c0 2-2 3-4 3S8 5 8 3z"/></svg>',
 season:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};
function renderTabs(){
  const running=!!S.match.timer.start;
  $('#tabs').innerHTML=[['plan','Plan'],['match','Match'],['squad','Squad'],['season','Season']].map(([k,l])=>
    `<button data-tab="${k}" ${view===k?'aria-current="page"':''}>${ICONS[k]}${l}${k==='match'&&running?'<span class="live"></span>':''}</button>`).join('');
}
function render(){renderTabs();({plan:renderPlan,match:renderMatch,squad:renderSquad,season:renderSeason})[view]();}

function renderPlan(){
  const m=S.match;
  if(S.players.length<9){
    $('#app').innerHTML=`<h1>Sunday Subs</h1><div class="empty" style="margin-top:16px"><h2 style="margin:0 0 6px">Add your squad first</h2><p class="muted" style="margin:0 0 14px">You need at least 9 players to fill a 9v9 team.</p><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn primary" data-go="squad">Add players</button><button class="btn" data-act="import">Restore a backup</button></div></div>`;return;
  }
  const F=FORMS[m.formation],blk=m.blocks[cur],ch=changes(cur);
  const inIds=ch?ch.on.map(o=>o.id):[],mvIds=ch?ch.moved.map(o=>o.id):[];
  const slots=F.map(([l,x,y],i)=>{const id=blk[i];
    const cls=['slot',i===0?'gk':'',id?'':'empty',inIds.includes(id)?'in':'',mvIds.includes(id)?'moved':''].join(' ');
    const p=id&&P(id);
    return `<button class="${cls}" style="left:${x}%;top:${y}%" data-slot="${i}" aria-label="${l}: ${p?esc(p.name):'empty'}"><span class="lbl">${l}</span><span class="shirt">${p?(p.num||esc(p.name[0])):'+'}</span>${p?`<span class="nm">${esc(p.name)}</span>`:''}</button>`}).join('');
  const bench=avail().filter(p=>!blk.includes(p.id));
  const tsug=thirtySuggest(),w=warnings();
  $('#app').innerHTML=`
  <div class="row"><h1 class="grow">Sunday Subs</h1><button class="btn small" data-act="newmatch">New match</button></div>
  <div class="matchbar"><label class="opp"><span>v</span><input id="opp" placeholder="Opponent" value="${esc(m.opp)}"></label>
    <select class="field" id="form" aria-label="Formation">${Object.keys(FORMS).map(f=>`<option ${f===m.formation?'selected':''}>${f}</option>`).join('')}</select></div>
  <div class="qs" role="group" aria-label="Game period">${BL.map((b,i)=>`<button data-q="${i}" aria-pressed="${i===cur}">${b[0]}–${b[1]}'<small>${i===0?'Kick-off':changes(i).count+' change'+(changes(i).count===1?'':'s')}</small>${m.blocks[i].some(x=>!x)?'<span class="dot"></span>':''}</button>`).join('')}</div>
  <div class="pitch ${benchSel?'placing':''}">
    <svg viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2">
      <rect x="10" y="10" width="280" height="380"/><line x1="10" y1="200" x2="290" y2="200"/><circle cx="150" cy="200" r="36"/>
      <rect x="80" y="10" width="140" height="58"/><rect x="80" y="332" width="140" height="58"/>
      <rect x="120" y="10" width="60" height="20"/><rect x="120" y="370" width="60" height="20"/></svg>
    ${slots}
  </div>
  <div class="bench"><div class="row"><strong class="grow" style="font-family:var(--cond);font-size:19px">Bench ${BL[cur][0]}–${BL[cur][1]}'</strong>
    ${cur>0?`<button class="btn small" data-act="copyprev">Copy ${BL[cur-1][0]}–${BL[cur-1][1]}' lineup</button>`:''}</div>
    <div class="chips">${bench.length?bench.map(p=>`<button class="chip" data-bench="${p.id}" aria-pressed="${benchSel===p.id}"><b>${esc(p.num||'')}</b>${esc(p.name)}</button>`).join(''):'<span class="muted">Nobody on the bench</span>'}</div>
    <div class="hint">${benchSel?`Now tap a position to bring ${esc(nm(benchSel))} on.`:'Tap a bench player then a position to sub them on, or tap any position to pick.'}</div></div>
  ${ch?boardHTML(cur,ch):''}
  ${w.length?`<div class="warns">${w.map(x=>`<div>${x}</div>`).join('')}</div>`:''}
  <h2>30-minute player this week</h2>
  <div class="thirty"><select class="field" id="thirty"><option value="">Not set</option>${avail().map(p=>`<option value="${p.id}" ${m.thirty===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    ${tsug?`<p>Next in the rotation: <strong>${esc(tsug.name)}</strong> (${thirtyCounts()[tsug.id]||0} so far this season)${m.thirty!==tsug.id?` <button class="btn small" data-act="usesug" style="margin-left:6px">Use</button>`:''}</p>`:''}</div>
  <h2>Minutes</h2>
  <div class="mins">${avail().map(p=>`<div class="mrow"><div class="n">${esc(p.name)}${m.thirty===p.id?'<small>30\' this week</small>':''}</div>
    <div class="segs">${m.blocks.map(b=>`<i class="${b.includes(p.id)?'f':''}"></i>`).join('')}</div><div class="m">${mins(p.id)}'</div></div>`).join('')}</div>
  <div class="actions"><button class="btn" data-act="share">Share sub sheet</button></div>`;
}
function boardHTML(b,ch){
  const rows=[];
  ch.on.forEach(o=>rows.push(`<div class="sub"><span class="tag on">ON</span><span>${esc(nm(o.id))} <em>${o.for?'for '+esc(nm(o.for))+', ':''}at ${pos(o.i)}</em></span></div>`));
  ch.loneOff.forEach(id=>rows.push(`<div class="sub"><span class="tag off">OFF</span><span>${esc(nm(id))}</span></div>`));
  ch.on.filter(o=>o.for).forEach(o=>rows.push(`<div class="sub"><span class="tag off">OFF</span><span>${esc(nm(o.for))}</span></div>`));
  ch.moved.forEach(o=>rows.push(`<div class="sub"><span class="tag mv">MOVE</span><span>${esc(nm(o.id))} <em>${pos(o.from)} to ${pos(o.to)}</em></span></div>`));
  return `<div class="board"><h3><span>Changes at ${BL[b][0]}'</span><span>${ch.count}</span></h3>${rows.length?rows.join(''):'<div class="none">No changes, same team carries on.</div>'}</div>`;
}

function elapsed(){const t=S.match.timer;return t.acc+(t.start?Date.now()-t.start:0)}
function renderMatch(){
  const m=S.match,e=elapsed(),min=e/60000,b=Math.min(3,Math.floor(min/15)),ft=min>=60;
  const next=b+1<=3&&!ft?b+1:null,ch=next?changes(next):null;
  const blk=m.blocks[ft?3:b];
  $('#app').innerHTML=`
  <div class="row"><h1 class="grow">${m.opp?'v '+esc(m.opp):'Match'}</h1><span class="muted">${esc(m.formation)}</span></div>
  <div class="clock"><div class="t" id="clk">${fmt(e)}</div><div class="q" id="qlbl">${ft?'Full time':`Playing ${BL[b][0]}–${BL[b][1]}'`}</div></div>
  <div class="prog"><span id="bar" style="width:${Math.min(100,min/60*100)}%"></span><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i></div>
  <div class="ctrls"><button class="btn primary" data-act="startstop">${m.timer.start?'Pause':(e>0?'Resume':'Kick off')}</button><button class="btn" data-act="reset">Reset</button></div>
  ${flash!==null?`<div class="alert" role="alert"><span>${flash===4?'Full time':`Subs now, ${BL[flash][0]}'`}</span><button class="btn small" data-act="dismiss">Done</button></div>`:''}
  ${flash!==null&&flash<4?boardHTML(flash,changes(flash)):''}
  ${next&&flash!==next?`<div class="board"><h3><span>Next changes at ${BL[next][0]}:00</span><span id="cd">in ${fmt(BL[next][0]*60000-e)}</span></h3>${ch.count?boardInner(ch):'<div class="none">No changes planned.</div>'}</div>`:''}
  <h2>On the pitch</h2>
  <div class="lineup">${blk.map((id,i)=>`<div><small>${pos(i)}</small>${id?esc(nm(id)):'—'}</div>`).join('')}</div>
  <div class="actions">
    <button class="btn" data-act="share">Share sub sheet</button>
    <button class="btn primary" data-act="finish">Save match to season</button></div>`;
}
function boardInner(ch){return boardHTML(0,ch).replace(/^<div class="board"><h3>.*?<\/h3>/,'').replace(/<\/div>$/,'')}

function renderSquad(){
  const list=byNum(S.players);
  $('#app').innerHTML=`<h1>Squad</h1>
  <p class="muted" style="margin:6px 0 12px">Tap <strong>GK</strong> for keepers. Untick <strong>In</strong> for anyone not available this Sunday.</p>
  ${list.length?`<div class="plist">${list.map(p=>`<div class="prow ${isAvail(p.id)?'':'out'}">
    <input class="num" inputmode="numeric" value="${esc(p.num||'')}" data-edit="num" data-id="${p.id}" aria-label="Shirt number" placeholder="#">
    <input class="nmi" value="${esc(p.name)}" data-edit="name" data-id="${p.id}" aria-label="Name">
    <div class="toggles"><button class="tg" data-gk="${p.id}" aria-pressed="${!!p.gk}">GK</button><button class="tg" data-avail="${p.id}" aria-pressed="${isAvail(p.id)}">In</button><button class="tg x" data-del="${p.id}" aria-label="Remove ${esc(p.name)}">✕</button></div></div>`).join('')}</div>`:'<div class="empty">No players yet. Add them below, or paste a list.</div>'}
  <div class="add"><input class="field" id="newnum" inputmode="numeric" placeholder="#"><input class="field" id="newname" placeholder="Player name"><button class="btn primary" data-act="add">Add</button></div>
  <h2>Paste a list</h2>
  <textarea class="field" id="bulk" rows="4" placeholder="One per line, e.g.&#10;1 Alfie&#10;4 Jack"></textarea>
  <div class="actions"><button class="btn" data-act="bulk">Add all</button></div>
  <p class="muted" style="font-size:14px;margin-top:18px">${avail().length} available of ${S.players.length}. Everything is saved on this phone.</p>`;
}

function renderSeason(){
  const c=thirtyCounts(),tot={},gp={};
  S.history.forEach(h=>Object.entries(h.mins).forEach(([id,v])=>{tot[id]=(tot[id]||0)+v;if(v>0)gp[id]=(gp[id]||0)+1}));
  const sug=thirtySuggest();
  $('#app').innerHTML=`<h1>Season</h1>
  ${sug?`<div class="board" style="margin-top:14px"><h3><span>Next 30-minute turn</span></h3><div class="sub" style="font-size:24px">${esc(sug.name)}</div></div>`:''}
  ${S.history.length?`<h2>Game time</h2><table><thead><tr><th>Player</th><th>Games</th><th>Mins</th><th>30' turns</th></tr></thead><tbody>
    ${byNum(S.players).map(p=>`<tr><td>${esc(p.name)}</td><td>${gp[p.id]||0}</td><td>${tot[p.id]||0}</td><td>${c[p.id]||0}</td></tr>`).join('')}</tbody></table>
    <h2>Matches</h2><div class="hist">${S.history.slice().reverse().map(h=>`<div><span><strong>${h.opp?'v '+esc(h.opp):'Match'}</strong> <span class="muted">${esc(h.date)}${h.thirty?', 30\': '+esc(nm(h.thirty)):''}</span></span><button class="tg x" data-delh="${h.id}" aria-label="Delete match">✕</button></div>`).join('')}</div>`
  :'<div class="empty" style="margin-top:16px">Saved matches appear here. Use <strong>Save match to season</strong> on the Match tab after each game to track minutes and whose turn it is for 30 minutes.</div>'}
  <h2>Backup</h2>
  <div class="backup">
    ${persisted===true?'<p class="ok">Saved permanently on this phone.</p>':persisted===false?'<p class="risk">This phone may clear the data if it runs low on space. Keep a backup.</p>':''}
    <p class="muted">${S.lastBackup?'Last backup: '+esc(S.lastBackup):'No backup yet.'} A backup holds your squad, this week\'s plan and the whole season in one file.</p>
    <div class="row"><button class="btn primary" data-act="export">Save backup</button><button class="btn" data-act="import">Restore</button></div>
  </div>`;
}

/* ---------- sheets ---------- */
function openSheet(html){$('#sheet').innerHTML=`<div class="sheet" data-close="1"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`}
function closeSheet(){$('#sheet').innerHTML=''}
let pending=null;
function ask(title,body,ok,fn,danger){pending=fn;openSheet(`<h2 style="margin:0 0 6px">${title}</h2>${body?`<p class="muted" style="margin:0 0 12px">${body}</p>`:''}<div class="actions"><button class="btn ${danger?'danger':'primary'}" data-act="confirm-ok">${ok}</button><button class="btn" data-close="1">Cancel</button></div>`)}
function pickFor(i){
  const blk=S.match.blocks[cur];
  const list=avail().map(p=>{const j=blk.indexOf(p.id);return{p,j}}).sort((a,b)=>(a.j>-1)-(b.j>-1));
  openSheet(`<h2 style="margin:0">${pos(i)}, ${BL[cur][0]}–${BL[cur][1]}'</h2>
  <div class="pick">${list.map(({p,j})=>`<button data-pick="${p.id}" data-i="${i}"><span class="pn">${esc(p.num||'')}</span><span class="pm">${esc(p.name)}${p.gk?' <small class="muted">GK</small>':''}</span><span class="ps">${j===i?'Here now':j>-1?'Swap from '+pos(j):'Bench'}<br>${mins(p.id)}'</span></button>`).join('')}
  ${blk[i]?`<button data-pick="" data-i="${i}"><span class="pn">–</span><span class="pm">Leave empty</span><span></span></button>`:''}</div>
  <div class="actions"><button class="btn" data-close="1">Cancel</button></div>`);
}
function place(i,id){
  const blk=S.match.blocks[cur];
  if(!id){blk[i]=null}
  else{const j=blk.indexOf(id);if(j>-1){blk[j]=blk[i];blk[i]=id}else blk[i]=id}
  save();
}

/* ---------- share ---------- */
function sheetText(){
  const m=S.match,L=[];
  L.push(`${m.opp?'v '+m.opp:'Sunday match'} (${m.formation})`);
  L.push(`Kick-off: `+m.blocks[0].map((id,i)=>`${pos(i)} ${id?nm(id):'-'}`).join(', '));
  for(let b=1;b<4;b++){const c=changes(b),parts=[];
    c.on.forEach(o=>parts.push(`${nm(o.id)} on${o.for?' for '+nm(o.for):''} at ${pos(o.i)}`));
    c.loneOff.forEach(id=>parts.push(`${nm(id)} off`));
    c.moved.forEach(o=>parts.push(`${nm(o.id)} ${pos(o.from)} to ${pos(o.to)}`));
    L.push(`${BL[b][0]}': ${parts.length?parts.join('; '):'no changes'}`);}
  L.push('Minutes: '+avail().map(p=>`${p.name} ${mins(p.id)}`).join(', '));
  return L.join('\n');
}
async function share(){
  const t=sheetText();
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Sub sheet copied');return}catch(e){}
  openSheet(`<h2 style="margin:0 0 8px">Sub sheet</h2><textarea class="field" rows="10" readonly>${esc(t)}</textarea><div class="actions"><button class="btn" data-close="1">Close</button></div>`);
}
function toast(msg){openSheet(`<p style="font-family:var(--cond);font-size:22px;font-weight:700;margin:4px 0 12px">${esc(msg)}</p><button class="btn" data-close="1" style="width:100%">OK</button>`)}

/* ---------- timer ---------- */
function beep(){try{if(!audio)return;[0,0.35].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.001,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.4,audio.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.28);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.3)})}catch(e){}}
async function keepAwake(on){try{if(on&&'wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
function tick(){
  const m=S.match;if(!m.timer.start)return;
  const min=elapsed()/60000;
  for(const b of [1,2,3,4]){const at=b===4?60:BL[b][0];
    if(min>=at&&!m.alerted.includes(b)){m.alerted.push(b);flash=b;save();
      if(b===4){m.timer.acc=elapsed();m.timer.start=null;keepAwake(false)}
      try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}beep();
      if(view!=='match')view='match';render();return}}
  if(view==='match'){const e=elapsed(),c=$('#clk'),bar=$('#bar'),cd=$('#cd');
    if(c)c.textContent=fmt(e);if(bar)bar.style.width=Math.min(100,e/3600000*100)+'%';
    const nb=Math.floor(e/900000)+1;if(cd&&nb<=3)cd.textContent='in '+fmt(nb*900000-e);}
}
setInterval(tick,500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.match.timer.start){keepAwake(true);tick()}});

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('button,[data-close]');if(!t)return;
  const d=t.dataset;
  if(d.close&&(t===ev.target||t.tagName==='BUTTON')){closeSheet();return}
  if(d.tab){view=d.tab;benchSel=null;render();window.scrollTo(0,0);return}
  if(d.go){view=d.go;render();return}
  if(d.q!==undefined){cur=+d.q;benchSel=null;render();return}
  if(d.bench){benchSel=benchSel===d.bench?null:d.bench;render();return}
  if(d.slot!==undefined){const i=+d.slot;if(benchSel){place(i,benchSel);benchSel=null;render()}else pickFor(i);return}
  if(d.pick!==undefined){place(+d.i,d.pick||null);closeSheet();render();return}
  if(d.gk){const p=P(d.gk);p.gk=!p.gk;save();render();return}
  if(d.avail){const id=d.avail;const now=!isAvail(id);S.match.avail[id]=now;
    if(!now){S.match.blocks.forEach(b=>b.forEach((x,i)=>{if(x===id)b[i]=null}));if(S.match.thirty===id)S.match.thirty=null}
    save();render();return}
  if(d.del){const id=d.del,p=P(id);ask(`Remove ${esc(p.name)}?`,'They come off the squad and out of this week\'s plan. Season totals already saved are kept.','Remove player',()=>{
    S.players=S.players.filter(x=>x.id!==id);S.match.blocks.forEach(b=>b.forEach((x,i)=>{if(x===id)b[i]=null}));
    if(S.match.thirty===id)S.match.thirty=null;save();render()},true);return}
  if(d.delh){const id=d.delh;ask('Delete this match?','Its minutes and 30-minute turn come off the season totals.','Delete match',()=>{S.history=S.history.filter(h=>h.id!==id);save();render()},true);return}
  const a=d.act;if(!a)return;
  if(a==='confirm-ok'){const f=pending;pending=null;closeSheet();f&&f();return}
  if(a==='add'){const n=$('#newname').value.trim();if(!n)return;S.players.push({id:uid(),name:n,num:$('#newnum').value.trim(),gk:false});save();render();$('#newname').focus()}
  if(a==='bulk'){$('#bulk').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{const mm=line.match(/^(\d+)[\s.)-]+(.+)$/);S.players.push({id:uid(),name:mm?mm[2].trim():line,num:mm?mm[1]:'',gk:false})});save();render()}
  if(a==='copyprev'){S.match.blocks[cur]=S.match.blocks[cur-1].slice();save();render()}
  if(a==='usesug'){const s=thirtySuggest();if(s){S.match.thirty=s.id;save();render()}}
  if(a==='share')share();
  if(a==='export')exportBackup();
  if(a==='import')$('#importFile').click();
  if(a==='newmatch')openSheet(`<h2 style="margin:0 0 6px">Start a new match?</h2><p class="muted" style="margin:0 0 12px">Your squad and season stay. Save this match to the season first if you haven't.</p>
    <div class="actions"><button class="btn primary" data-act="new-keep">Keep this lineup as a starting point</button><button class="btn" data-act="new-clear">Start from a blank pitch</button><button class="btn" data-close="1">Cancel</button></div>`);
  if(a==='new-keep'||a==='new-clear'){const old=S.match,n=blankMatch(old.formation);if(a==='new-keep')n.blocks=old.blocks.map(b=>b.slice());n.avail=old.avail;S.match=n;flash=null;cur=0;keepAwake(false);save();closeSheet();render()}
  if(a==='startstop'){const tm=S.match.timer;
    if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(tm.start){tm.acc+=Date.now()-tm.start;tm.start=null;keepAwake(false)}else{if(elapsed()>=3600000)return;tm.start=Date.now();keepAwake(true)}
    save();render()}
  if(a==='reset'){ask('Reset the clock?','The clock goes back to 00:00 and stops. Your lineup plan isn\'t touched.','Reset clock',()=>{S.match.timer={start:null,acc:0};S.match.alerted=[];flash=null;keepAwake(false);save();render()},true)}
  if(a==='dismiss'){flash=null;render()}
  if(a==='finish'){const m=S.match;if(!m.blocks.some(b=>b.some(Boolean))){toast('Plan a lineup first');return}
    ask('Save this match to the season?','Adds everyone\'s minutes and this week\'s 30-minute player to the season totals.','Save match',()=>{
    const mm={};avail().forEach(p=>mm[p.id]=mins(p.id));
    S.history.push({id:uid(),date:m.date,opp:m.opp,mins:mm,thirty:m.thirty});
    m.timer={start:null,acc:0};m.alerted=[];flash=null;keepAwake(false);save();view='season';render()})}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='opp'){S.match.opp=t.value.trim();save()}
  if(t.id==='form'){S.match.formation=t.value;save();render()}
  if(t.id==='thirty'){S.match.thirty=t.value||null;save();render()}
  if(t.dataset.edit){const p=P(t.dataset.id);if(!p)return;if(t.dataset.edit==='name'){const v=t.value.trim();if(v)p.name=v;else t.value=p.name}else p.num=t.value.trim();save()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='newname'){ev.preventDefault();document.querySelector('[data-act="add"]').click()}if(ev.key==='Escape')closeSheet()});
/* ---------- backup + storage ---------- */
let persisted=null;
async function checkPersist(){try{if(!navigator.storage||!navigator.storage.persisted)return;persisted=await navigator.storage.persisted();
  if(!persisted&&navigator.storage.persist)persisted=await navigator.storage.persist();if(view==='season')render()}catch(e){}}
async function exportBackup(){
  const d=today(),name=`sunday-subs-backup-${d}.json`;
  const body=JSON.stringify({app:'sunday-subs',version:1,exported:new Date().toISOString(),state:{...S,lastBackup:d}});
  const file=new File([body],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sunday Subs backup'});S.lastBackup=d;save();render();return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(file),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);S.lastBackup=d;save();render();
}
$('#importFile').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  let data;try{data=JSON.parse(await f.text())}catch(e){toast('That file isn\'t a Sunday Subs backup');return}
  const st=data&&data.state;
  if(!data||data.app!=='sunday-subs'||!st||!Array.isArray(st.players)||!st.match||!Array.isArray(st.history)){toast('That file isn\'t a Sunday Subs backup');return}
  const when=data.exported?new Date(data.exported).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'an unknown date';
  ask('Restore this backup?',`From ${esc(when)}: ${st.players.length} players and ${st.history.length} saved matches. This replaces everything on this phone.`,'Restore backup',()=>{
    st.match.timer=st.match.timer||{start:null,acc:0};st.match.alerted=st.match.alerted||[];st.match.avail=st.match.avail||{};
    S=st;cur=0;benchSel=null;flash=null;save();view=S.players.length>=9?'plan':'squad';render();toast('Backup restored')},true);
});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
checkPersist();

if(S.players.length<9)view=S.players.length?'squad':'plan';
render();
</script>
</body>
</html>
